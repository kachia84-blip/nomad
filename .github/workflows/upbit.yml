# 업비트 유목민(4시간봉): 업비트 4시간봉은 한국시간 01·05·09·13·17·21시에 시작해 4시간 뒤 마감됩니다.
# GitHub 예약 실행은 늦거나 빠지는 일이 있어서 매시 17분마다 시도하고, 이미 최신 4시간봉으로 계산돼 있으면 몇 초 만에 건너뜁니다.
# 그래서 결과는 하루 6번(09·13·17·21·01·05시 이후 첫 성공 실행) 갱신됩니다.
name: 업비트 유목민 4시간봉

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "upbit_nomad/**"
      - ".github/workflows/upbit.yml"

permissions:
  contents: write

concurrency:
  group: upbit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: upbit_nomad/requirements.txt
      - run: pip install -r upbit_nomad/requirements.txt
      - name: 스캔 실행
        working-directory: upbit_nomad
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python scan.py --out ../docs/upbit --if-needed; else python scan.py --out ../docs/upbit; fi
      - name: 결과 저장
        run: |
          git config user.name "nomad-bot"
          git config user.email "nomad-bot@users.noreply.github.com"
          git add docs/upbit
          if ! git diff --cached --quiet; then
            git commit -m "업비트 4시간봉 스캔 갱신"
            for i in 1 2 3; do
              if git pull --rebase -q; then
                git push -q && break
              else
                git rebase --abort 2>/dev/null || true; git fetch -q; git reset --hard origin/main
                echo "같은 파일을 다른 쪽(PC)이 먼저 갱신해서 양보합니다"; break
              fi
              sleep 5
            done
          fi
