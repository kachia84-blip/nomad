# 업비트 유목민(4시간봉): 업비트 4시간봉은 한국시간 01·05·09·13·17·21시에 시작해 4시간 뒤 마감됩니다.
# 마감 직후인 09·13·17·21·01·05시(KST)에 하루 6번 스캔하고 docs/upbit 에 결과를 올립니다. (UTC = KST - 9시간)
name: 업비트 유목민 4시간봉

on:
  schedule:
    - cron: "2 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "upbit_nomad/**"
      - ".github/workflows/upbit.yml"

permissions:
  contents: write

concurrency:
  group: upbit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: upbit_nomad/requirements.txt
      - run: pip install -r upbit_nomad/requirements.txt
      - name: 스캔 실행
        working-directory: upbit_nomad
        run: python scan.py --out ../docs/upbit
      - name: 결과 저장
        run: |
          git config user.name "nomad-bot"
          git config user.email "nomad-bot@users.noreply.github.com"
          git add docs/upbit
          if ! git diff --cached --quiet; then
            git commit -m "업비트 4시간봉 스캔 갱신"
            for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
          fi
